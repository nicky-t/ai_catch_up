# 情報源。RSS/公式ブログを一次ソース、Web 検索を補助とする。
# agent は WebFetch で実際に取得できたページのみ出典にしてよい。
primary:
  - name: OpenAI News
    url: https://openai.com/news/
    rss: https://openai.com/news/rss.xml
    lang: en
    notes: RSS は取得可。個別記事は 403 になることが多い → RSS の要約＋報道記事で補う
  - name: Anthropic News
    url: https://www.anthropic.com/news
    lang: en
  - name: Google DeepMind Blog
    url: https://deepmind.google/discover/blog/
    rss: https://deepmind.google/blog/rss.xml
    lang: en
  - name: Google AI Blog
    url: https://blog.google/technology/ai/
    rss: https://blog.google/technology/ai/rss/
    lang: en
  - name: Meta AI Blog
    url: https://ai.meta.com/blog/
    lang: en
  - name: Microsoft Source (AI)
    url: https://news.microsoft.com/source/topics/ai/
    lang: en
    notes: 旧 blogs.microsoft.com/ai の RSS は 410 で廃止。一覧ページのみ（日付が取りにくい）。補助扱い
  - name: Hugging Face Blog
    url: https://huggingface.co/blog
    rss: https://huggingface.co/blog/feed.xml
    lang: en
  - name: Claude Code Changelog
    url: https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md
    lang: en
    notes: raw URL で取得。日付が無いので「前回取り上げたバージョン」と比較して新規分のみ扱う

secondary:
  - name: TechCrunch AI
    url: https://techcrunch.com/category/artificial-intelligence/
    rss: https://techcrunch.com/category/artificial-intelligence/feed/
    lang: en
  - name: Simon Willison
    url: https://simonwillison.net/
    rss: https://simonwillison.net/atom/everything/
    lang: en
  - name: ITmedia AI+
    url: https://www.itmedia.co.jp/aiplus/
    rss: https://rss.itmedia.co.jp/rss/2.0/aiplus.xml
    lang: ja
    notes: RSS には @IT・MONOist 等グループ媒体も混在。出典の媒体名は記事ページの実際の媒体名を使う
  - name: 日経クロステック AI
    url: https://xtech.nikkei.com/top/it/
    lang: ja
    notes: 有料記事が多く冒頭のみ取得可。見出しの把握用。出典にする場合は冒頭で確認できた事実のみ
  - name: Zenn (AI トピック)
    url: https://zenn.dev/topics/ai
    rss: https://zenn.dev/topics/ai/feed
    lang: ja
  - name: Publickey
    url: https://www.publickey1.jp/
    rss: https://www.publickey1.jp/atom.xml
    lang: ja

  - name: Google Developers Blog
    url: https://developers.googleblog.com/
    rss: https://developers.googleblog.com/feeds/posts/default
    lang: en
  - name: Anthropic Engineering
    url: https://www.anthropic.com/engineering
    lang: en
  - name: Ars Technica AI
    url: https://arstechnica.com/ai/
    rss: https://arstechnica.com/ai/feed/
    lang: en

# 実務・コミュニティ系。「今日の現場ネタ」（個人の使い方・話題の Skill・すぐ試せるワークフロー）用。
# ニュースの一次ソースではなく、人気シグナル（ポイント・いいね・スター）付きで現場の使い方を拾う。
community:
  - name: Hacker News（人気投稿の検索 RSS）
    url: https://hnrss.org/newest?q=Claude+Code&points=50
    rss: https://hnrss.org/newest?q=Claude+Code&points=50
    lang: en
    notes: hnrss.org の検索 RSS。q= を Claude+Code / skills / MCP など 2〜3 通りに変えて引く。%22 で囲んだクエリは 502 になるので使わない（2026-08-23 確認）。points= で人気フィルタ済み（ポイント数を人気の根拠に使える）
  - name: Reddit r/ClaudeAI（日次トップ）
    url: https://www.reddit.com/r/ClaudeAI/top/.rss?t=day
    lang: en
    notes: curl では 403（2026-08-23 確認）。WebFetch でも不可なら当日は HN・Zenn で代替（excluded には移さない）
  - name: Zenn（Claude Code トピック）
    url: https://zenn.dev/topics/claudecode
    rss: https://zenn.dev/topics/claudecode/feed
    lang: ja
    notes: いいね数の多い記事を優先。トピック一覧ページでいいね数を確認できる
  - name: Qiita（ClaudeCode タグ）
    url: https://qiita.com/tags/claudecode
    rss: https://qiita.com/tags/claudecode/feed
    lang: ja
  - name: anthropics/skills（公式 Skill 集）
    url: https://raw.githubusercontent.com/anthropics/skills/main/README.md
    lang: en
    notes: 新着・更新された Skill の確認用。github.com の HTML は 403 になることがあるため raw URL で README を取得する（Claude Code Changelog と同じ方式）
  - name: GitHub Trending
    url: https://github.com/trending?since=daily
    lang: en
    notes: skills / MCP / agent 系リポジトリの急上昇を確認。スター数・急増は「人気が出ている」根拠に使える。403 で取得できない日はスキップしてよい

# 取得不能で除外した情報源（再試行しない）
excluded:
  - url: https://www.theverge.com/
    reason: WebFetch がドメインごと拒否（2026-08-19 確認）
  - url: https://blogs.microsoft.com/ai/feed/
    reason: HTTP 410（RSS 廃止）

# Web 検索の補助クエリ（日付を付けて検索する）
search_queries:
  - "AI news {date}"
  - "生成AI 発表 {date}"
  - "LLM release {date}"
  - "生成AI 導入 企業 {month}"

# 現場ネタ用の補助クエリ（community ソースで拾えなかった日の補完）
tips_search_queries:
  - "Claude Code Skills 活用 {month}"
  - "Claude Code 使い方 話題 {month}"
  - "MCP サーバー 便利 {month}"
  - "生成AI 個人 活用 ワークフロー {month}"
